<script>
for (const card of document.querySelectorAll("article")) {
  const portrait = card.querySelector(".portrait");
  const base = portrait.getAttribute("src");
  const name = card.querySelector("h2").textContent;
  card.addEventListener("click", event => {
    const choice = event.target.closest("button");
    if (!choice) return;
    choice.setAttribute("aria-pressed", String(choice.getAttribute("aria-pressed") !== "true"));
    const active = Array.from(card.querySelectorAll('button[aria-pressed="true"]'));
    const state = active.length === 2 ? "both" : active[0]?.dataset.slot;
    portrait.src = state ? "dressing/" + state + "/" + card.dataset.code + ".webp" : base;
    portrait.alt = name + " · " + (active.map(button => button.querySelector("strong").textContent).join(" + ") || "기본 모습");
  });
}
