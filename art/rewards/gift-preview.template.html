<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyCrew · 선물 연출 미리보기</title><style>
/* APP_STYLES */
*{box-sizing:border-box}body{margin:0;background:#243d37;color:#f9f4e7;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;line-height:1.5}button,select,input{font:inherit}button{cursor:pointer}button:disabled{cursor:wait}button:focus-visible,select:focus-visible{outline:3px solid #e8bf62;outline-offset:3px}.demo{max-width:1040px;padding:32px 20px 60px;margin:auto}.intro{margin-bottom:24px}.intro small{color:#dbbc78;letter-spacing:.12em}.intro h1{font-size:28px;margin:8px 0}.intro p{color:#c2d2c4;font-size:14px}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;align-items:start}.controls{border:1px solid #708577;border-radius:20px;padding:20px;background:#304d42}.controls label{display:block;font-size:13px;margin:0 0 16px}.controls select{width:100%;padding:10px;margin-top:7px;border:1px solid #b7c5ad;border-radius:9px;background:#fffaf0;color:#32493a}.controls p{font-size:12px;color:#c9d8c9}.controls .check{display:flex;gap:8px;align-items:center}.controls button{display:block;width:100%;border:0;border-radius:12px;padding:12px;background:#e8c577;color:#493e26;font-weight:750}.controls output{display:block;margin-top:18px;color:#ffe5a4;font-size:13px}.dialog{display:block;position:relative;margin:0 auto;width:100%;max-height:none;overflow:hidden}.button{border:0;border-radius:12px;min-height:48px;align-items:center;justify-content:center;font-weight:750;padding:12px 18px}.primary{background:#28755d;color:white;box-shadow:0 4px 0 #205441}.demo-footer{text-align:center;font-size:12px;color:#b9cabb;margin-top:24px}.preview{min-width:0}.preview.mobile .dialog{max-width:360px}.card img{object-fit:contain}.preview .close{line-height:1}.preview .open{font:inherit}.reveal{isolation:isolate}@media(max-width:740px){.demo{padding:22px 14px}.layout{grid-template-columns:1fr;gap:20px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}.controls label{margin:0}.controls p,.controls output{grid-column:1/-1;margin:0}.intro h1{font-size:24px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="demo">
<header class="intro"><small>STUDYCREW · GIFT PREVIEW</small><h1>두근두근, 어떤 친구가 나올까?</h1><p>카톡 초대나 로그인 없이 연출만 체험해 보세요. 실제 계정·도감에는 아무 변화도 생기지 않습니다.</p></header>
<div class="layout"><aside class="controls">
<label>받는 사람<select id="recipient"><option value="inviter">초대한 사용자</option><option value="friend">초대받은 친구</option></select></label>
<label>마지막에 나올 카드<select id="winner"><option value="random">매번 랜덤으로 보기</option></select></label>
<label>화면 폭<select id="width"><option value="desktop">PC 크기</option><option value="mobile">모바일 크기</option></select></label>
<label class="check"><input type="checkbox" id="reduce">연출 건너뛰기</label>
<button id="restart">처음부터 다시 보기 ↻</button>
<output id="status" aria-live="polite">카드팩를 눌러 시작해 보세요.</output>
<p>카드팩 개봉 영상 → 실루엣 빠르게 전환 → 점점 감속 → 잠깐 멈춤 → 카드 공개!</p>
<p>이미지를 포함한 독립 HTML입니다. 인터넷 연결 없이도 열 수 있어요.</p>
</aside><div id="preview" class="preview"><section id="stage" class="dialog" aria-labelledby="reward-title"></section></div></div>
<p class="demo-footer">미리보기에서는 공개 카드를 자유롭게 바꿀 수 있어요. 실제 서비스에서는 서버에서 지급된 카드가 공개됩니다.</p>
</main><script>
const cards=/* CARD_DATA */;
const giftArt=/* GIFT_ART */;
const stage=document.querySelector('#stage'), status=document.querySelector('#status'), selector=document.querySelector('#winner');
for(const card of cards){const option=document.createElement('option');option.value=card.code;option.textContent=`${card.number}. ${card.name}`;selector.append(option);const preload=new Image();preload.src=card.image;}
const delays=[80,80,90,100,110,130,160,200,260,340,460,700];
let phase='wrapped',sequence=[],frame=0,result=null,timer=null;
const gift=`<span class="gift" aria-hidden="true"><img class="giftClosed" src="${giftArt.closed}" width="640" height="960" alt=""></span>`;
const shuffled=items=>{const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function header(){const bonus=document.querySelector('#recipient').value==='friend';return `<button class="close" aria-label="선물 연출 초기화" onclick="reset()">×</button><p class="eyebrow">${bonus?'WELCOME GIFT · 친구 초대 보너스':'FRIENDSHIP GIFT · 초대 성공 선물'}</p><h2 id="reward-title">${phase==='revealed'?`${result.name}, 도감에 합류!`:phase==='rolling'?'누가 찾아올까요?':'친구 덕분에, 선물 도착!'}</h2><p class="subtitle">${phase==='revealed'?'아직 만나지 못했던 공부 친구를 발견했어요.':phase==='rolling'?'두근두근… 곧 만나요!':bonus?'내 첫 공부캐에 보너스 카드 한 장 더!':'초대한 친구가 첫 결과를 도감에 저장했어요.'}</p>`;}
function render(){stage.dataset.phase=phase;let html=header();
 if(phase==='wrapped') html+=`<button class="open" onclick="openGift()" aria-label="선물 포장 열기"><span class="halo"></span>${gift}<span class="tap">눌러서 카드팩 뜯기</span></button><p class="guarantee">아직 없는 카드 <strong>1장 확정</strong> · 중복 없이 만나요</p><p class="hint">지금은 연출 미리보기예요. 마음껏 다시 열어보세요.</p>`;
 else if(phase==='opening') html+=`<div class="cinema"><video src="${giftArt.video}" poster="${giftArt.poster}" width="720" height="960" muted playsinline preload="auto" aria-label="카드팩 개봉 영상"></video><p class="hint">봉투 속 공부 친구를 꺼내는 중…</p></div><button class="skip" onclick="finish()">바로 공개하기</button>`;
 else if(phase==='rolling') html+=`<div class="reel" aria-hidden="true"><span class="reelLabel">어떤 공부 친구일까?</span><div class="reelPortrait">${cards.map(card=>`<img src="${card.image}" alt="" data-code="${card.code}" class="reelHidden">`).join('')}<span class="question">?</span></div><strong>???</strong><span class="reelDots">✦ · ✦ · ✦</span></div><button class="skip" onclick="finish()">바로 공개하기</button>`;
 else html+=`<div class="reveal"><div class="confetti" aria-hidden="true">${Array.from({length:16},(_,i)=>`<i style="--i:${i};--x:${i*37%100}%;--turn:${i*43}deg"></i>`).join('')}</div><span class="newBadge">NEW FRIEND · 카드 +1</span><div class="card" data-family="${result.family}"><span class="cardNumber">STUDYCREW · No. ${result.number}</span><div class="portrait"><img src="${result.image}" width="240" height="240" alt="${result.name}, 새로 얻은 공부캐"></div><h3>${result.name}</h3><p>${result.line}</p></div></div><section class="progress"><div><strong>도감이 한 칸 더 채워졌어요</strong><span>2 / 16</span></div><progress max="16" value="2" aria-label="미리보기 수집 진행도"></progress><p>다음엔 누가 올까요? 새 친구를 초대해 다음 카드를 만나봐요.</p></section><button class="button primary done" onclick="reset()">다른 선물도 열어보기 ↻</button><p class="hint">미리보기 결과입니다. 실제 카드는 지급되지 않아요.</p>`;
 stage.innerHTML=html;if(phase==='rolling') updateFrame();
}
function updateFrame(){stage.dataset.frame=frame;for(const image of stage.querySelectorAll('[data-code]')) image.className=image.dataset.code===sequence[frame].code?'reelCurrent':'reelHidden';stage.querySelector('.reelLabel').textContent=frame>=9?'이제 곧…!':'어떤 공부 친구일까?';}
function tick(){timer=setTimeout(()=>{frame++;if(frame===delays.length)finish();else{updateFrame();tick();}},delays[frame]);}
function openGift(){if(phase!=='wrapped')return;result=cards.find(card=>card.code===selector.value)||cards[Math.floor(Math.random()*cards.length)];sequence=[...shuffled(cards.filter(card=>card.code!==result.code)).slice(0,11),result];if(document.querySelector('#reduce').checked){finish();return;}phase='opening';status.textContent='카드팩을 뜯고 있어요…';render();const clip=stage.querySelector('video');const advance=()=>{if(phase!=='opening'||!clip.isConnected)return;clearTimeout(timer);clip.pause();phase='rolling';frame=0;status.textContent='빠르게 → 천천히 → 마지막 한 장!';render();tick();};clip.onended=advance;clip.onerror=advance;timer=setTimeout(advance,8000);clip.play().catch(advance);}
function finish(){clearTimeout(timer);stage.querySelector('video')?.pause();phase='revealed';status.textContent=`짠! ${result.name} 카드가 나왔어요.`;render();}
function reset(){clearTimeout(timer);stage.querySelector('video')?.pause();phase='wrapped';frame=0;result=null;status.textContent='카드팩을 눌러 시작해 보세요.';render();}
document.querySelector('#restart').onclick=reset;document.querySelector('#recipient').onchange=reset;selector.onchange=reset;document.querySelector('#width').onchange=e=>document.querySelector('#preview').classList.toggle('mobile',e.target.value==='mobile');document.querySelector('#reduce').checked=matchMedia('(prefers-reduced-motion:reduce)').matches;document.querySelector('#reduce').onchange=()=>{if(phase==='opening'||phase==='rolling')finish();};reset();
</script></body></html>
