<html lang="ko">
<head>

<title>StudyCrew · 공부 스킬북 미리보기</title>
<style>
:root{--ink:#35463e;--muted:#737b71;--paper:#faf7ef;--line:#e3dece;--green:#344e41;--purple:#806297;--pink:#b85473}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,"Malgun Gothic",system-ui,sans-serif;line-height:1.6}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ad7cbd;outline-offset:4px}button{color:inherit}img{max-width:100%;display:block}header,main,footer{max-width:1180px;margin:auto;padding:0 30px}header{height:96px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:16px}.logo{width:166px;max-height:66px;object-fit:contain}.preview-label{font-size:12px;letter-spacing:.08em;border:1px solid #d9d0e0;border-radius:30px;padding:6px 13px;color:var(--purple)}main{padding-top:40px;padding-bottom:50px}.eyebrow{font-size:12px;color:var(--purple);font-weight:800;letter-spacing:.11em}h1{font-size:clamp(29px,4vw,45px);line-height:1.3;letter-spacing:-.055em;margin:12px 0 16px}h1 em{font-style:normal;color:var(--purple)}h2,h3,p{margin-top:0}.intro{display:grid;grid-template-columns:1fr 420px;gap:38px;align-items:center;margin-bottom:32px}.intro p{font-size:15px;max-width:540px;color:#687368}.intro .note{font-size:12px;color:var(--muted);margin-bottom:0}.lock-lineup{display:flex;justify-content:center;gap:16px;background:radial-gradient(ellipse,#ece2ef 0,transparent 68%);padding:18px 0}.lock-sample{width:112px;text-align:center}.lock-sample img{height:133px;object-fit:contain;margin:auto;filter:drop-shadow(0 9px 6px #593d5220)}.lock-sample span{display:inline-block;margin-top:13px;background:#fffdf8;border:1px solid var(--line);padding:3px 13px;border-radius:20px;font-size:12px;color:#817056}.desk{border:1px solid #e3d8df;border-radius:24px;background:linear-gradient(115deg,#fffaf1,#f3ebf8);padding:24px;margin-bottom:36px;box-shadow:0 5px 0 #e ;background:#fffdf8;width:230px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.tile{text-align:left;min-width:0;background:#fffdf8;border:1px solid #e0d9c8;border-radius:20px;padding:12px;box-shadow:0 4px 0 #e4dfd144;transition:transform .18s,box-shadow .18s;position:relative;overflow:hidden}.tile:hover{transform:translateY(-4px);box-shadow:0 8px 22px #51413716}.tile.open{border-color:#d8c5df}.tile-visual{height:174px;border-radius:13px;background:radial-gradient(ellipse at 50% 70%,#f3e6e8,#f9f3e9 70%);display:grid;place-items:center;overflow:hidden}.tile-visual .lock{height:142px;width:130px;object-fit:contain;filter:drop-shadow(0 8px 7px #68472115)}.tile-visual .art{width:100%;height:100%;object-fit:cover}.tile-copy{padding:13px 5px 5px}.tag{font-size:10px;letter-spacing:.05em;color:#987444;font-weight:800;display:block;margin-bottom:5px}.tile h3{font-size:17px;line-height:1.4;letter-spacing:-.03em;margin-bottom:7px}.tile p{font-size:12px;color:#758075;line-height:1.55;height:38px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-bottom:13px}.tile-bottom{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #eee8dd;padding-top:10px;font-size:11px;font-weight:700;color:#8f647c}.tile-bottom .heart{width:20px;height:20px}.empty{padding:45px;text-align:center;grid-column:1/-1;color:var(--muted)}footer{text-align:center;padding-bottom:35px;font-size:12px;color:#939387}.modal{width:min(750px,calc(100% - 36px));max-height:90dvh;padding:0;border:1px solid #d9cbdc;border-radius:24px;background:#fffcf6;color:var(--ink);box-shadow:0 28px 100px #212b3b40}.modal::backdrop{background:#27312acc;backdrop-filter:blur(5px)}.modal-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:#fffcf6f5;border-bottom:1px solid #e9e1d5}.modal-head span{font-size:12px;color:#887294}.close{border:1px solid #ded5cf;background:white;border-radius:50%;font-size:24px;width:36px;height:36px;line-height:1}.locked-detail{text-align:center;padding:25px 30px 35px}.locked-detail h2{font-size:27px;margin:15px 0 10px;letter-spacing:-.04em}.locked-detail p{max-width:470px;margin:0 auto 20px;font-size:14px;color:#6f766c}.stage{position:relative;display:grid;place-items:center;width:240px;height:225px;margin:auto;background:radial-gradient(ellipse,#efdeec,transparent 70%)}.stage>img{height:192px;filter:drop-shadow(0 14px 10px #8a658826)}.stage.revealing>img{animation:unlock .9s ease-in-out both}.spark{position:absolute;width:28px;left:106px;top:90px;animation:heartburst .85s ease-out both;animation-delay:calc(var(--i)*45ms);pointer-events:none}.lock-note{font-size:12px!important;color:#8b7890!important;margin-top:14px!important;margin-bottom:0!important}.unlock-button{font-size:15px;padding:13px 24px;min-width:240px}.detail-art{width:100%;aspect-ratio:3/2;object-fit:cover;animation:appear .5s both}.detail-body{padding:26px 30px}.detail-body h2{font-size:27px;line-height:1.3;margin:8px 0 12px}.detail-body>p{font-size:15px;color:#697668}.success-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#786185;background:#f1e8f6;border:1px solid #dfcee9;padding:5px 12px;border-radius:25px}.steps{padding:0;list-style:none;counter-reset:step;margin:22px 0}.steps li{counter-increment:step;display:flex;gap:12px;font-size:14px;line-height:1.7;margin-bottom:14px}.steps li:before{content:counter(step);display:grid;place-items:center;background:#efe6f4;color:#87689b;width:27px;height:27px;border-radius:9px;flex-shrink:0;font-size:12px;font-weight:800}.tip{background:#f2efe4;border:1px solid #e5deca;border-radius:14px;padding:15px;font-size:13px}.tip p{margin:6px 0 0;color:#737566}.detail-buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.detail-buttons button{flex:1}.demo-note{font-size:11px!important;margin:15px 0 0!important;color:#8c8c82!important}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#354c41;color:white;padding:12px 22px;border-radius:16px;box-shadow:0 8px 25px #20342830;z-index:8;font-size:14px;max-width:calc(100% - 30px);text-align:center;transition:.2s}.toast.show{transform:translate(-50%,0);opacity:1}@keyframes unlock{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(-7deg)}40%{transform:rotate(7deg)}65%{transform:scale(1.14);filter:drop-shadow(0 0 25px #e8b04f)}85%{transform:scale(.9)}}@keyframes heartburst{0%{opacity:0;transform:translate(0,20px) scale(.3)}35%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.1)}}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(min-width:768px) and (max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.intro{grid-template-columns:1fr 330px;gap:20px}.lock-sample{width:95px}}@media(max-width:767px){header,main,footer{padding-left:18px;padding-right:18px}header{height:77px}.logo{width:135px}.preview-label{font-size:10px;padding:5px 9px}main{padding-top:25px}.intro{grid-template-columns:1fr;gap:5px;margin-bottom:20px}.intro p{font-size:14px;margin-bottom:12px}.lock-lineup{padding:10px 0}.lock-sample{width:86px}.lock-sample img{height:104px}.lock-sample span{margin-top:9px;font-size:11px}.desk{padding:18px;border-radius:19px;margin-bottom:27px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}.controls label{grid-column:1/-1}.controls select{max-width:none;width:100%;grid-column:1/-1}.controls .purple{grid-column:1/-1}.controls .primary{grid-column:1/-1}.controls .rose{grid-column:1/-1}.catalog-head{align-items:flex-start;flex-direction:column;gap:12px}.catalog-head h2{font-size:21px}.view-switch{width:100%}.view{flex:1}.search{width:100%;margin:3px 0 0}.filter{flex:1;font-size:12px;padding:8px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{padding:8px;border-radius:16px}.tile-visual{height:135px}.tile-visual .lock{height:112px;width:100px}.tile-copy{padding:10px 3px 3px}.tile h3{font-size:15px}.tile p{font-size:11px;height:35px}.tile-bottom{font-size:10px}.modal{width:calc(100% - 20px);max-height:94dvh;border-radius:20px}.locked-detail{padding:20px 18px 26px}.detail-body{padding:20px}.detail-body h2{font-size:23px}.stage{height:205px}.stage>img{height:175px}.detail-buttons{flex-direction:column}.status{font-size:12px}.wallet strong{font-size:27px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.tile{text-align:center;padding:18px 12px 12px}.tile-visual{height:124px;background:transparent;position:relative;overflow:visible}.tile-visual .original-icon{width:112px;height:112px;object-fit:contain}.tile.locked .original-icon{filter:blur(1.5px) saturate(.7);opacity:.48}.tile-visual .mini-lock{position:absolute;width:38px;height:47px;object-fit:contain;left:calc(50% + 25px);bottom:0;filter:drop-shadow(0 3px 3px #5b3a3830)}.tile-copy{padding-top:10px}.tile h3{margin-bottom:5px}.tile-bottom{border:0;justify-content:center;padding:2px;min-height:26px}.tile-visual .art{border-radius:12px}.unlock-video{width:min(320px,100%);aspect-ratio:1;border-radius:20px;display:block;margin:auto}.locked-detail .stage{height:150px}.locked-detail .stage>img{height:116px}.unlock-question{font-weight:700;color:#825774!important}.cancel-unlock{margin-left:8px}.locked-detail .unlock-question strong{color:#b55272}@media(max-width:767px){.tile{padding:13px 9px 10px}.tile-visual{height:108px}.tile-visual .original-icon{width:88px;height:88px}.tile-visual .mini-lock{width:31px;height:38px;left:calc(50% + 19px);bottom:5px}.cancel-unlock{display:block;margin:12px auto 0}.tile h3{font-size:14px}.tile-bottom{font-size:12px}}
</style>

<body>
<header><img id="logo" class="logo" alt="StudyCrew"><span class="preview-label">SKILLBOOK PREVIEW</span></header>
<main>
<section class="intro"><div><span class="eyebrow">작은 하트로 여는, 나만의 공부 공략집</span><h1>모으는 재미 다음엔,<br><em>내 스킬로 만드는 재미.</em></h1><p>공부캐를 만나 시그니처 스킬을 열고,<br>차곡차곡 모은 하트로 새로운 공부법을 발견해요.</p><p class="note">디자인 체험용 미리보기예요. 실제 계정과 하트에는 영향을 주지 않아요.</p></div><div class="lock-lineup" id="locks" aria-label="하트 1개, 2개, 3개 자물쇠"></div></section>
<section class="desk" aria-label="미리보기 체험 도구"><div class="desk-top"><div class="wallet"><img class="heart" data-icon="heart" alt="하트"><div><small>미리보기 하트</small><strong id="balance">3</strong><span> 개</span></div></div><button class="quiet" id="reset">처음부터 다시</button></div><div class="controls"><label for="character">만나 볼 공부캐</label><select id="character"></select><button class="primary" id="draw">캐릭터 카드 획득 체험</button><button class="rose" id="add">하트 3개 더 받기</button><button class="purple" id="shortcut">바로가기 선물 체험 +1</button><button class="purple" id="install">앱 설치 선물 체험 +3</button></div><p class="status" id="status" role="status" aria-live="polite">하트 3개로 시작해요. 아래에서 마음에 드는 스킬을 눌러 보세요.</p></section>
<section aria-labelledby="catalog-title"><div class="catalog-head"><div><h2 id="catalog-title">나의 공부 스킬북</h2><p id="count"></p></div><div class="view-switch" aria-label="미리보기 방식"><button class="view" data-view="play" aria-pressed="true">잠금 해제 체험</button><button class="view" data-view="gallery" aria-pressed="false">전체 그림 보기</button></div></div><div class="toolbar"><button class="filter" data-filter="all" aria-pressed="true">전체 28</button><button class="filter" data-filter="signature" aria-pressed="false">시그니처 16</button><button class="filter" data-filter="general" aria-pressed="false">기본 스킬 12</button><input class="search" id="search" type="search" placeholder="스킬 이름 검색" aria-label="스킬 이름 검색"></div><div class="grid" id="grid"></div></section>
</main><footer>StudyCrew · 공부 스킬북 디자인 미리보기<br>새로고침하면 체험 기록이 초기화됩니다.</footer>
<dialog class="modal" id="modal" aria-labelledby="detail-title"><div class="modal-head"><span id="modal-label">숨겨진 공부 스킬</span><button class="close" id="close" aria-label="닫기">×</button></div><div id="detail"></div></dialog><div class="toast" id="toast" role="status"></div>
<script>
const DATA=/*__PREVIEW_DATA__*/;
const $=id=>document.getElementById(id);
const state={balance:3,unlocked:new Set(),owned:new Set(),paid:new Set(),practiced:new Set(),installed:false,shortcut:false,view:'play',filter:'all',query:'',selected:null,busy:false};
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let revealTimer,toastTimer;
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(id,cls='heart',alt='')=>`<img class="${cls}" src="${DATA.icons[id]}" alt="${alt}">`;
function notify(text){$('status').textContent=text;$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),3200)}
function render(){
 $('balance').textContent=state.balance;$('count').textContent=`스킬 ${state.unlocked.size} / 28 해제 · 시그니처는 해당 캐릭터 또는 하트 3개로 열어요.`;
 $('shortcut').disabled=state.shortcut||state.installed;$('install').disabled=state.installed;$('install').textContent=state.installed?'앱 설치 선물 받음':`앱 설치 선물 체험 +${state.shortcut?2:3}`;
 document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===state.view)));
 document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===state.filter)));
 const list=DATA.skills.filter(s=>(state.filter==='all'||(state.filter==='signature'?!!s.owner:!s.owner))&&(!state.query||(s.name+' '+(s.owner||'')+' '+s.id).toLowerCase().includes(state.query)));
 $('grid').innerHTML=list.map(s=>{const open=state.unlocked.has(s.id),gallery=state.view==='gallery';return `<button class="tile ${open?'open':gallery?'':'locked'}" data-skill="${s.id}" aria-haspopup="dialog" aria-label="${esc(s.name)} · ${open?'해제됨':`하트 ${s.cost}개로 해제`}"><div class="tile-visual">${gallery?`<img class="art" src="${s.art}" alt="${esc(s.name)} 사용 장면" loading="lazy">`:`<img class="original-icon" src="${s.methodIcon}" alt="" loading="lazy">${open?'':icon('lock-'+s.cost,'mini-lock')}`}</div><div class="tile-copy"><h3>${esc(s.name)}</h3><div class="tile-bottom"><span>${gallery||open?'↗':icon('heart')+' '+s.cost}</span></div></div></button>`}).join('')||'<p class="empty">찾는 스킬이 없어요. 다른 이름으로 검색해 보세요.</p>';
}
function showDetail(id){state.selected=id;renderDetail();if(!$('modal').open)$('modal').showModal();$('modal').scrollTop=0}
function renderDetail(){
 const s=DATA.skills.find(s=>s.id===state.selected);if(!s)return;const open=state.unlocked.has(s.id),gallery=state.view==='gallery';
 $('modal-label').textContent=gallery?'전체 그림 미리보기':open?'나의 공부 공략집':'숨겨진 공부 스킬';
 if(open||gallery){
 $('detail').innerHTML=`<img class="detail-art" src="${s.art}" alt="${esc(s.name)} 사용 장면"><div class="detail-body"><span class="success-chip">${gallery?'이미지 미리보기':state.owned.has(s.id)?'캐릭터로 열린 시그니처':'스킬 해제 완료'}${s.owner?' · '+esc(s.owner):''}</span><h2 id="detail-title">${esc(s.name)}</h2><p>${esc(s.oneLine)}</p><ol class="steps">${s.steps.map(step=>`<li>${esc(step)}</li>`).join('')}</ol><div class="tip"><strong>내 수준에 맞추기</strong><p>${esc(s.level)}</p></div><div class="detail-buttons">${open?`<button class="primary" data-action="practice" ${state.practiced.has(s.id)?'disabled':''}>${state.practiced.has(s.id)?'첫 실천 하트 받음':'첫 실천 보상 체험 +1'}</button>`:`<button class="primary" data-action="locked">잠금 해제 체험으로 보기</button>`}<button class="quiet" data-action="back">스킬북으로 돌아가기</button></div><p class="demo-note">${gallery?'그림 확인 모드에서는 잠긴 스킬의 이미지도 볼 수 있어요.': '이 미리보기에서만 실천 시간을 생략해요. 실제 서비스는 10분 실천과 세 질문 응답 후 처음 한 번 하트를 지급해요.'}</p></div>`;
 }else{
 $('detail').innerHTML=`<div class="locked-detail"><div class="stage" id="stage">${icon('lock-'+s.cost,'detail-lock')}</div><h2 id="detail-title">${esc(s.name)}</h2><p class="unlock-question">하트 <strong>${s.cost}개</strong>를 사용해 이 스킬을 열까요?</p><button class="primary unlock-button" data-action="unlock" ${state.balance<s.cost?'disabled':''}>${icon('heart')} 하트 ${s.cost}개 사용해 열기</button><button class="quiet cancel-unlock" data-action="back">다음에 할게요</button><p class="lock-note">${state.balance<s.cost?'하트가 모자라요. 체험 도구에서 하트를 더 받아 보세요.':`현재 하트 ${state.balance}개 → 사용 후 ${state.balance-s.cost}개`}</p>${s.owner?'<p class="lock-note">해당 캐릭터를 만나도 열려요.<br>하트로 먼저 열었다면, 캐릭터 획득 시 하트 3개를 돌려드려요.</p>':''}</div>`;
 }
}
function unlock(){const s=DATA.skills.find(s=>s.id===state.selected);if(state.busy||state.unlocked.has(s.id)||state.balance<s.cost)return;state.busy=true;state.balance-=s.cost;state.unlocked.add(s.id);state.paid.add(s.id);render();const finish=()=>{if(!state.busy)return;clearTimeout(revealTimer);$('unlock-video')?.pause();state.busy=false;if($('modal').open)renderDetail();notify(`${s.name} 해제! 이제 나의 스킬이에요.`)};if(reduced.matches){finish();return}$('detail').innerHTML=`<div class="locked-detail"><video id="unlock-video" class="unlock-video" src="${DATA.videos[s.cost].src}" poster="${DATA.videos[s.cost].poster}" muted playsinline autoplay aria-label="하트 ${s.cost}개가 채워지고 자물쇠가 열리는 영상"></video><h2 id="detail-title">${esc(s.name)}</h2><p role="status">하트가 쏙! 새로운 스킬이 열리고 있어요.</p><button id="skip-video" class="quiet">바로 카드 보기</button></div>`;const clip=$('unlock-video');clip.onended=finish;clip.onerror=finish;$('skip-video').onclick=finish;revealTimer=setTimeout(finish,12000);clip.play().catch(finish)}
function closeModal(){clearTimeout(revealTimer);$('unlock-video')?.pause();state.busy=false;$('modal').close()}
$('logo').src=DATA.logo;document.querySelectorAll('[data-icon]').forEach(el=>el.src=DATA.icons[el.dataset.icon]);
$('locks').innerHTML=[1,2,3].map(n=>`<div class="lock-sample">${icon('lock-'+n,'',`빈 하트 ${n}개 자물쇠`)}<span>하트 ${n}개</span></div>`).join('');
$('character').innerHTML=DATA.skills.filter(s=>s.owner).map(s=>`<option value="${s.id}" ${s.id==='sq3r'?'selected':''}>${esc(s.owner)} · ${esc(s.name)}</option>`).join('');
$('grid').addEventListener('click',e=>{const b=e.target.closest('[data-skill]');if(b)showDetail(b.dataset.skill)});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});
$('search').oninput=e=>{state.query=e.target.value.trim().toLowerCase();render()};
$('add').onclick=()=>{state.balance+=3;render();notify('미리보기 하트 3개를 더 받았어요.')};
$('shortcut').onclick=()=>{if(state.shortcut||state.installed)return;state.shortcut=true;state.balance++;render();notify('바로가기 선물 체험! 하트 1개를 받았어요.')};
$('install').onclick=()=>{if(state.installed)return;state.installed=true;const reward=state.shortcut?2:3;state.balance+=reward;render();notify(`앱 설치 선물 체험! 하트 ${reward}개를 받았어요. 실제 설치는 진행하지 않아요.`)};
$('draw').onclick=()=>{const s=DATA.skills.find(s=>s.id===$('character').value);if(state.owned.has(s.id)){notify('이미 만난 캐릭터예요. 다른 친구를 골라 보세요.');return}const reward=1+Math.floor(Math.random()*3),refund=state.paid.has(s.id)?3:0;state.balance+=reward+refund;state.owned.add(s.id);state.unlocked.add(s.id);state.view='play';render();showDetail(s.id);notify(`${s.owner}를 만났어요! 하트 +${reward} · 시그니처 해제${refund?' · 사용한 하트 3개 반환':''}`)};
$('reset').onclick=()=>{closeModal();Object.assign(state,{balance:3,installed:false,shortcut:false,view:'play',filter:'all',query:'',selected:null});['unlocked','owned','paid','practiced'].forEach(k=>state[k].clear());$('search').value='';render();notify('처음으로 돌아왔어요. 하트 3개로 다시 시작해요.')};
$('close').onclick=closeModal;$('modal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});$('modal').addEventListener('click',e=>{if(e.target===$('modal')){const r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
$('detail').addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(!action||state.busy)return;if(action==='unlock')unlock();if(action==='back')closeModal();if(action==='locked'){state.view='play';render();renderDetail();$('modal').scrollTop=0}if(action==='practice'&&!state.practiced.has(state.selected)){state.practiced.add(state.selected);state.balance++;render();renderDetail();notify('첫 실천 완료 체험! 하트 1개를 받았어요.')}});
render();
</script>
</body>
</html>
