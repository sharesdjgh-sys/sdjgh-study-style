<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<base href="../art/characters/special/events/sdj-school-v2/">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>서여고 스페셜 카드 · 미리보기</title>
<style>
:root{color-scheme:light;--ink:#233c33;--muted:#70776d;--paper:#f6f4ed;--line:#dfdfd3}
*{box-sizing:border-box}
img{height:auto}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Malgun Gothic",system-ui,sans-serif}
button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #ad793e;outline-offset:4px}
main{max-width:1180px;margin:auto;padding:32px 28px}
header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}
.eyebrow{font-size:11px;letter-spacing:.18em;font-weight:700;color:#75836b;margin:0 0 8px}
h1{font-size:28px;letter-spacing:-1px;margin:0;font-weight:700}
.sub{font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.6}
.edition{font-size:12px;white-space:nowrap;border:1px solid var(--line);border-radius:20px;padding:8px 13px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.switch{background:#e8e9df;padding:4px;border-radius:10px;display:flex;gap:4px}
.switch button{border:0;border-radius:7px;padding:9px 16px;background:transparent;color:#677061;font-size:13px}
.switch button[aria-pressed="true"]{background:var(--ink);color:#fff}
.counter{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.frame{position:relative;background:#e6e2d7;border-radius:15px;overflow:hidden;box-shadow:0 12px 32px #28362b12}
.hero{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.hero img{display:block;width:100%;aspect-ratio:1672/941;object-fit:contain;max-height:60vh}
.expand{position:absolute;right:14px;bottom:14px;background:#20332cce;color:white;padding:7px 11px;border-radius:7px;font-size:12px;pointer-events:none}
.caption{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 1px 20px}
h2{margin:0;font-size:18px;letter-spacing:-.5px}
.description{color:var(--muted);font-size:13px;margin:6px 0 0;line-height:1.5}
.actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.actions button,.download{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;text-decoration:none;padding:9px 13px;font-size:13px}
.actions button{font-size:18px;line-height:20px}
.thumbs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.thumb{padding:5px;border:2px solid transparent;border-radius:12px;background:transparent;color:var(--muted);text-align:left}
.thumb[aria-pressed="true"]{border-color:var(--ink);background:#fff;color:var(--ink)}
.thumb img{width:100%;aspect-ratio:1672/941;object-fit:cover;display:block;border-radius:6px}
.thumb span{display:block;padding:9px 5px 5px;font-size:12px;font-weight:600}
footer{border-top:1px solid var(--line);margin-top:23px;padding-top:14px;font-size:11px;color:var(--muted);line-height:1.6}
dialog{padding:0;border:0;background:#141e19;color:white;border-radius:12px;width:calc(100vw - 40px);max-width:1800px;max-height:95vh}
dialog::backdrop{background:#101913ed}
.dialogbar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;gap:16px}
.dialogbar p{margin:0;font-size:14px}
.dialogbar button{background:#ffffff15;border:1px solid #ffffff40;color:white;border-radius:8px;padding:8px 15px}
dialog img{display:block;width:100%;max-height:calc(95vh - 70px);object-fit:contain}
@media(max-width:600px){main{padding:24px 16px}h1{font-size:23px}.edition{display:none}header{margin-bottom:22px}.caption{align-items:start;flex-direction:column;gap:12px}.actions{width:100%}.download{margin-left:auto}.thumbs{gap:5px}.thumb{padding:3px;border-radius:8px}.thumb span{font-size:10px;padding:7px 0 3px;text-align:center}.expand{font-size:10px;padding:5px 8px;bottom:8px;right:8px}.hero img{max-height:none}.switch button{padding:8px 13px}dialog{width:calc(100vw - 16px)}}
</style>
</head>
<body>
<main>
<header>
<div><p class="eyebrow">SEODAEJEON GIRLS’ HIGH SCHOOL</p><h1>서여고 스페셜 카드</h1><p class="sub">소품 속 작은 교표, 함께하는 특별한 순간.</p></div>
<span class="edition">이벤트 에디션 · 5종</span>
</header>
<div class="toolbar">
<div class="switch" role="group" aria-label="이미지 버전">
<button type="button" id="event" aria-pressed="true">이벤트 카드</button>
<button type="button" id="original" aria-pressed="false">원본 비교</button>
</div>
<span class="counter" id="counter">01 / 05</span>
</div>
<div class="frame">
<button type="button" class="hero" id="enlarge" aria-label="선택한 이미지 크게 보기"><img id="hero" src="group-photo.webp" alt="16인 단체 이벤트 카드" width="1672" height="941"></button>
<span class="expand">크게 보기 ↗</span>
</div>
<div class="caption">
<div aria-live="polite"><h2 id="title">모두 함께 · 16인</h2><p class="description" id="description">왼쪽 앞줄 비버의 앞치마에 작은 교표 자수.</p></div>
<div class="actions"><button type="button" id="prev" aria-label="이전 카드">←</button><button type="button" id="next" aria-label="다음 카드">→</button><a class="download" id="download" href="group-photo.png" target="_blank" rel="noopener">PNG 열기 ↗</a></div>
</div>
<nav class="thumbs" id="thumbs" aria-label="카드 선택"></nav>
<footer>이미지를 누르면 크게 볼 수 있습니다. ← → 키로 이동 · Esc로 확대 닫기<br>원본은 보존된 별도 이벤트 시안입니다.</footer>
<noscript><p>카드 선택 기능을 사용하려면 브라우저에서 JavaScript를 허용해 주세요.</p></noscript>
</main>
<dialog id="lightbox" aria-label="카드 확대 미리보기">
<div class="dialogbar"><p id="largeTitle">모두 함께 · 16인</p><button type="button" id="close">닫기 ×</button></div>
<img id="large" alt="">
</dialog>
<script>
const cards = [
  {key:"group-photo",label:"모두 함께",title:"모두 함께 · 16인",detail:"왼쪽 앞줄 비버의 앞치마에 작은 교표 자수.",original:"../../group-photo"},
  {key:"visual",label:"시각형",title:"시각형 친구들 · 4인",detail:"카멜레온의 가방 덮개에 작은 교표 장식.",original:"../../families/visual"},
  {key:"auditory",label:"청각형",title:"청각형 친구들 · 4인",detail:"왼쪽 아래 초록 배낭에 자연스럽게 들어간 교표.",original:"../../families/auditory"},
  {key:"tactile",label:"촉각형",title:"촉각형 친구들 · 4인",detail:"테이블 위 연필 머그컵에 인쇄한 교표.",original:"../../families/tactile"},
  {key:"motion",label:"운동형",title:"운동형 친구들 · 4인",detail:"쿼카가 들고 있는 작은 카드 속 교표.",original:"../../families/motion"}
];
let index = 0, original = false;
const $ = id => document.getElementById(id);
cards.forEach((card,i)=>{
  const button=document.createElement("button");
  button.type="button";button.className="thumb";button.setAttribute("aria-label",card.title+" 보기");
  const img=document.createElement("img");img.src=card.key+".webp";img.alt="";img.width=1672;img.height=941;
  const label=document.createElement("span");label.textContent=card.label;
  button.append(img,label);button.addEventListener("click",()=>{index=i;render();});$("thumbs").append(button);
});
function render(){
  const card=cards[index], path=original?card.original:card.key, version=original?"원본":"이벤트 카드";
  $("hero").src=path+".webp";$("hero").alt=card.title+" "+version;
  $("title").textContent=card.title;
  $("description").textContent=original?"교표가 없는 원본 이미지입니다.":card.detail;
  $("counter").textContent=String(index+1).padStart(2,"0")+" / 05";
  $("event").setAttribute("aria-pressed",String(!original));$("original").setAttribute("aria-pressed",String(original));
  $("download").href=path+".png";
  [...$("thumbs").children].forEach((button,i)=>button.setAttribute("aria-pressed",String(i===index)));
  if($("lightbox").open){$("large").src=path+".png";$("large").alt=$("hero").alt;$("largeTitle").textContent=card.title+" · "+version;}
}
function move(delta){index=(index+delta+cards.length)%cards.length;render();}
$("event").onclick=()=>{original=false;render();};
$("original").onclick=()=>{original=true;render();};
$("prev").onclick=()=>move(-1);$("next").onclick=()=>move(1);
$("enlarge").onclick=()=>{$("lightbox").showModal();render();};
$("close").onclick=()=>$("lightbox").close();
$("lightbox").addEventListener("click",e=>{if(e.target===$("lightbox"))$("lightbox").close();});
document.addEventListener("keydown",e=>{
  if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;
  if(e.key==="ArrowRight"){e.preventDefault();move(1);}
  if(e.key==="ArrowLeft"){e.preventDefault();move(-1);}
});
render();
</script>
</body>
</html>
