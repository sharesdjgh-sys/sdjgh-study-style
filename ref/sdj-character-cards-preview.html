document.querySelectorAll(".person").forEach((b,i)=>b.setAttribute("aria-pressed",String(i===current)));
$("#event-mode").setAttribute("aria-pressed",String(!original));$("#original-mode").setAttribute("aria-pressed",String(original));
$(".cards").innerHTML=cards.map((c,i)=>'<article class="card '+c.kind+'"><button class="art" data-card="'+c.id+'" aria-label="'+escapeText(c.name+" · "+c.title)+' 크게 보기"><img src="'+url(c,original)+'" alt="'+escapeText(c.name+" · "+c.title+" · "+(original?"원본":"교표 에디션"))+'" width="1024" height="1536"><span class="zoom" aria-hidden="true">↗</span></button><div class="card-info"><div><span class="tag">'+(c.kind==="daily"?"DAILY · 일상":"SPECIAL 0"+(i+1)+" · 특별")+'</span><h3>'+escapeText(c.title)+'</h3><p class="place">'+escapeText(c.placementKo)+'</p></div><a class="download" href="'+eventRoot+c.id+'.png" target="_blank" rel="noopener">PNG ↗</a></div></article>').join("");
$(".cards").scrollLeft=0;
}
$("#prev").onclick=()=>select(current-1);$("#next").onclick=()=>select(current+1);
$("#event-mode").onclick=()=>{original=false;select(current)};$("#original-mode").onclick=()=>{original=true;select(current)};
function renderModal(){const c=modalCard;$("#modal-title").textContent=c.name+" · "+c.title;$("#modal-image").src=url(c,modalOriginal);$("#modal-image").alt=c.title+" · "+(modalOriginal?"원본":"교표 에디션");$("#modal-label").textContent=(modalOriginal?"원본":"교표 에디션")+" · "+c.placementKo;$("#modal-compare").textContent=modalOriginal?"교표 에디션 보기":"원본 보기";$("#modal-download").href=eventRoot+c.id+".png"}
$(".cards").onclick=e=>{const b=e.target.closest("[data-card]");if(!b)return;modalCard=data.find(c=>c.id===b.dataset.card);modalOriginal=original;renderModal();$("dialog").showModal()};
$("#modal-compare").onclick=()=>{modalOriginal=!modalOriginal;renderModal()};
$("#modal-close").onclick=()=>$("dialog").close();
$("dialog").addEventListener("click",e=>{if(e.target===$("dialog")){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}});
document.addEventListener("keydown",e=>{if(e.altKey||e.ctrlKey||e.metaKey||$("dialog").open)return;if(e.key==="ArrowLeft"){e.preventDefault();select(current-1)}if(e.key==="ArrowRight"){e.preventDefault();select(current+1)}});
select(0);
</script></body></html>
