<script>
const cards=JSON.parse(document.querySelector('#card-data').textContent);
const $=s=>document.querySelector(s);
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let scope='all', page=0, active=0, filtered=cards; const pageSize=6;
const names=[...new Map(cards.filter(c=>c.kind!=='group').map(c=>[c.code,c.name])).entries()];
names.forEach(([code,name])=>$('#character').add(new Option(name,code)));
const kindName=k=>({special:'특별',daily:'일상',group:'단체'}[k]);
function render(){
 filtered=cards.filter(c=>(scope==='all'||(scope==='group'?c.kind==='group':c.kind!=='group'))&&(!$('#character').value||c.code===$('#character').value)&&(!$('#kind').value||c.kind===$('#kind').value));
 const pages=Math.max(1,Math.ceil(filtered.length/pageSize)); page=Math.min(page,pages-1);
 $('#heading').textContent=$('#character').value?$('#character').selectedOptions[0].text+'의 카드':({all:'전체 카드',character:'캐릭터 카드',group:'함께하는 단체 카드'}[scope]);
 $('#status').textContent=filtered.length?filtered.length+'장 중 '+(page*pageSize+1)+'–'+Math.min((page+1)*pageSize,filtered.length)+'장':'카드가 없습니다';
 $('#page-count').textContent=(page+1)+' / '+pages;
 $('#prev').disabled=page===0; $('#next').disabled=page>=pages-1;
 $('#grid').innerHTML=filtered.slice(page*pageSize,(page+1)*pageSize).map((c,i)=>'<article class="card '+(c.kind==='group'?'group':'')+'"><button class="open" data-index="'+(page*pageSize+i)+'" aria-label="'+escapeHtml(c.name+' · '+c.title+' 확대 보기')+'"><img src="../'+escapeHtml(c.webp)+'" alt="'+escapeHtml(c.name+' · '+c.title)+'" decoding="async"><span class="view-label">확대 ↗</span></button><div class="meta"><strong>'+escapeHtml(c.name)+'</strong><span class="tag">'+kindName(c.kind)+'</span></div><h2>'+escapeHtml(c.title)+'</h2></article>').join('');
}
document.querySelectorAll('[data-scope]').forEach(button=>button.addEventListener('click',()=>{
 scope=button.dataset.scope; page=0; $('#character').value=''; $('#kind').value='';
 $('#character').disabled=scope==='group'; $('#kind').disabled=scope==='group';
 document.querySelectorAll('[data-scope]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));render();
}));
['#character','#kind'].forEach(s=>$(s).addEventListener('change',()=>{page=0;render()}));
function changePage(delta){page+=delta;render();$('.toolbar').scrollIntoView({block:'start'});}
$('#prev').addEventListener('click',()=>changePage(-1));$('#next').addEventListener('click',()=>changePage(1));
function show(index){active=(index+filtered.length)%filtered.length;const c=filtered[active];
 $('#detail-image').src='../'+c.webp;$('#detail-image').alt=c.name+' · '+c.title;
 $('#detail-name').textContent=c.name+' / '+kindName(c.kind)+' 카드';
 $('#detail-title').textContent=c.title;$('#detail-placement').textContent=c.placement;
 $('#png').href='../'+c.png;$('#detail-count').textContent=(active+1)+' / '+filtered.length;
 if(!$('#viewer').open)$('#viewer').showModal();
}
$('#grid').addEventListener('click',e=>{const b=e.target.closest('[data-index]');if(b)show(Number(b.dataset.index))});
$('.close').addEventListener('click',()=>$('#viewer').close());
$('#detail-prev').addEventListener('click',()=>show(active-1));$('#detail-next').addEventListener('click',()=>show(active+1));
$('#viewer').addEventListener('click',e=>{if(e.target===$('#viewer')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}});
$('#viewer').addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();show(active+(e.key==='ArrowRight'?1:-1))}});
render();
</script>
